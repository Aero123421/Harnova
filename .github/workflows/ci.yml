name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  DSH_GATE_CONCURRENCY: '1'
  DSH_COVERAGE_MAX_WORKERS: '2'
  DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
  DSH_SNAPSHOT_MAX_CONCURRENCY: '2'
  DSH_WEB_SNAPSHOT_WORKERS: '2'

jobs:
  linux:
    name: Linux / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [static, coverage, consumers, bench]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Linux sandbox
        run: bash scripts/prepare-ci-bubblewrap.sh
      - name: Install snapshot browsers
        if: matrix.suite == 'consumers'
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium webkit
      - name: Install benchmark browser
        if: matrix.suite == 'bench'
        run: pnpm --filter @deepseek-ai/dsh-benchmarks exec playwright install --with-deps chromium
      - name: Prepare Office runtime
        if: matrix.suite == 'consumers'
        run: pnpm run prepare:primary-runtime --target linux-x64 --output "$RUNNER_TEMP/office-runtime" --cache "$RUNNER_TEMP/office-runtime-downloads"
      - name: Check types
        if: matrix.suite == 'static'
        run: pnpm run typecheck
      - name: Run keyless Linux checks
        run: pnpm run check:ci:${{ matrix.suite }}

  native:
    name: ${{ matrix.os }} / build and unit tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable Windows symlinks
        if: runner.os == 'Windows'
        shell: pwsh
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Prepare Electron for native application tests
        run: pnpm --filter @deepseek-ai/dsh-desktop exec install-electron
      - name: Run native unit tests
        run: pnpm run test --maxWorkers=2
      - name: Run Windows process and PowerShell checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          pnpm exec vitest run --no-file-parallelism --testTimeout 90000
          packages/shell/tool-pwsh/tests/loader.spec.ts
          packages/workflow/workflow-ptc/tests/workflow-ptc.spec.ts
          packages/workflow/tool-ralph/tests/integration.spec.ts
          packages/subprocess/subprocess-local/tests/process-exit.spec.ts

  node-compat:
    name: Node ${{ matrix.node }} / source launch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24.9', '26']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/prepare-ci-bubblewrap.sh
      - run: pnpm run check:node-compat
      - run: pnpm exec vitest run packages/boot/app-boot/tests/loader-shape.compat.spec.ts

  python-sdk:
    name: Python SDK / keyless
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python -m pip install uv==0.11.23
      - run: uv run --python 3.10 --group test --project python/sdk pytest

  all-checks-passed:
    name: all checks passed
    runs-on: ubuntu-24.04
    needs: [linux, native, node-compat, python-sdk]
    if: ${{ !cancelled() }}
    steps:
      - name: Require every platform check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" != 'success,success,success,success' ]]; then
            echo "::error::Platform checks did not all succeed: $RESULTS"
            exit 1
          fi
