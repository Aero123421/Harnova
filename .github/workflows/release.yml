name: Packed installation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Build, pack, and install locally
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify-package-dependencies
      - run: pnpm run verify-npm-install-layout
      - run: pnpm run release:verify --family dsh
      - run: pnpm run build:official
      - run: pnpm run release:pack --family dsh --out dist/npm --concurrency 2
      - run: pnpm run release:pack --family vendor --out dist/npm-vendor --concurrency 2
      - run: pnpm run release:verify-packed-install --family vendor --from dist/npm-vendor
      - name: Pack local Landlock entry
        run: |
          pnpm --dir native/system run build:ts
          pnpm --dir native/system/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"
      - run: pnpm run release:verify-packed-install --family dsh --from dist/npm --from dist/npm-vendor --from dist/npm-landlock
      - uses: actions/upload-artifact@v7
        with:
          name: harnova-local-package-smoke
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7
