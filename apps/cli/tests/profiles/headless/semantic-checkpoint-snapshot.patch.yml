# Patch for resuming one seeded semantic-checkpoint session over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        file: !!js process.env.DSH_SNAPSHOT_FILE
        overrideFile: !!js process.env.DSH_SNAPSHOT_OVERRIDE

    # Publish the persisted agent before the driver selects the single root.
    - id: resumed-agent
      name: './tests/fixtures/semantic-checkpoint-agent.ts'

# Replay middleware advertises no catalog; explicitly enable this recorded route.
- id: model-access
  config:
    initialized: true
    providers:
      deepseek-official:
        enabled: true
        models: [deepseek-v4-flash]
