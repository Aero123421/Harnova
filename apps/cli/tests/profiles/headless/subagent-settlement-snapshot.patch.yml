# Replay-backed continuable child settlement patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-loop
  inject: [sessionPersistence]
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'

    # Hold the parent's second step until the manager notice enters its inbox.
    - id: settlement-fence
      name: './tests/fixtures/subagent-settlement-fence.ts'

# Replay middleware advertises no catalog; explicitly enable this recorded route.
- id: model-access
  config:
    initialized: true
    providers:
      deepseek-official:
        enabled: true
        models: [deepseek-v4-flash]
