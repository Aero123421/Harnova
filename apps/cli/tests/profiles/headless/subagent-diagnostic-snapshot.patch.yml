# Patch for resuming one seeded corrupt-child diagnostic over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: session-query-sqlite
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: session-query
      name: './tests/fixtures/subagent-diagnostic-query.ts'

    - id: replay
      name: '@deepseek-ai/dsh-llm-replay'

    # Publish the persisted agent before the driver selects the single root.
    - id: resumed-agent
      name: './tests/fixtures/subagent-diagnostic-agent.ts'

# Replay middleware advertises no catalog; explicitly enable this recorded route.
- id: model-access
  config:
    initialized: true
    providers:
      deepseek-official:
        enabled: true
        models: [deepseek-v4-flash]
